<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanaki · 로그인 애니메이션 (레퍼런스)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap">
<style>
/*
  nanaki 로그인 화면 레퍼런스 구현 — 반응형 (모바일 < 1024px, PC ≥ 1024px)
  타임라인은 spec.md 참고. --k 로 전체 속도 배율 조정(1 = 기본).
*/
:root{
  --accent:#2E7D4F; --leaf:#6CC08F; --text:#FFFFFF; --text-sub:#DDF2E5; --pre:#A8D5BA;
  --ease-in:cubic-bezier(.2,.8,.2,1); --ease-pop:cubic-bezier(.3,1.4,.5,1);
  --k:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--accent);color:var(--text)}

.login{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:128px 24px 40px;text-align:center}
.wordmark{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-0.02em}
.avatar{position:relative;width:128px;height:128px;margin-top:40px}
.avatar svg{display:block;width:100%;height:100%;overflow:visible}
.phrase-row{height:36px;margin-top:40px;display:flex;align-items:center;justify-content:center}
.phrase{display:inline-flex;font-size:20px;line-height:28px;font-weight:700;letter-spacing:-0.01em}
.phrase span{display:inline-block;white-space:pre;color:var(--pre);vertical-align:top}
.slogan{margin-top:8px;margin-bottom:40px!important;font-size:16px;line-height:24px;color:var(--text-sub)}
.actions{width:100%;max-width:360px;margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn-google{height:48px;border-radius:9999px;border:1px solid #747775;background:#FFFFFF;color:#1F1F1F;display:flex;align-items:center;justify-content:center;gap:12px;font:500 14px/20px Roboto,'Pretendard Variable',sans-serif;cursor:pointer}
.btn-guest{height:44px;border:0;background:none;color:var(--text);font-family:inherit;font-size:14px;font-weight:600;line-height:20px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}
.note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--text-sub)}
button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}

@media (min-width:1024px){
  .login{justify-content:center;padding:40px}
  .wordmark{font-size:40px;line-height:48px}
  .avatar{width:160px;height:160px}
  .phrase-row{height:40px}
  .phrase{font-size:24px;line-height:32px}
  .slogan{font-size:18px;line-height:28px}
  .actions{margin-top:48px}
}

/* ---------- 애니메이션 ---------- */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
@keyframes tilt{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
@keyframes swayL{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes swayR{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.3;transform:scale(.5) rotate(45deg)}}
@keyframes key{0%{color:var(--pre);transform:none}50%{color:#FFFFFF;transform:translateY(-6px)}100%{color:#FFFFFF;transform:none}}
@keyframes blurout{0%{max-width:1em;opacity:1;filter:blur(0)}100%{max-width:0;opacity:0;filter:blur(6px)}}
@keyframes grow{to{transform:scale(1.2)}}

.anim{animation-fill-mode:both}
/* 시간 = 초 × --k */
.wordmark{animation:up calc(.6s*var(--k)) var(--ease-in) calc(.1s*var(--k)) both}
.avatar svg{animation:float calc(3.2s*var(--k)) ease-in-out calc(.6s*var(--k)) infinite}
.ring{position:absolute;inset:0;border-radius:9999px;border:2px solid #FFFFFF;animation:ring calc(2.4s*var(--k)) ease-out infinite both}
.ring.r1{animation-delay:calc(.6s*var(--k))}
.ring.r2{animation-delay:calc(1.8s*var(--k))}
.av-circle{transform-box:fill-box;transform-origin:center;animation:pop calc(.55s*var(--k)) var(--ease-pop) 0s both}
.av-face{transform-box:fill-box;transform-origin:center bottom;animation:tilt calc(1.2s*var(--k)) ease-in-out calc(.7s*var(--k)) both}
.av-eyes{transform-box:fill-box;transform-origin:center;animation:blink calc(4s*var(--k)) calc(1.2s*var(--k)) infinite}
.av-leafL{transform-box:fill-box;transform-origin:right bottom;animation:swayL calc(3s*var(--k)) ease-in-out calc(.8s*var(--k)) infinite}
.av-leafR{transform-box:fill-box;transform-origin:left bottom;animation:swayR calc(3s*var(--k)) ease-in-out calc(.9s*var(--k)) infinite}
.av-spark{transform-box:fill-box;transform-origin:center;animation:twinkle calc(2s*var(--k)) ease-in-out calc(.9s*var(--k)) infinite both}

.phrase{animation:up calc(.6s*var(--k)) var(--ease-in) calc(.8s*var(--k)) both, grow calc(.4s*var(--k)) var(--ease-pop) calc(2.6s*var(--k)) forwards}
.phrase .k{animation:key calc(.45s*var(--k)) ease-out both}
.phrase .k1{animation-delay:calc(1.4s*var(--k))}
.phrase .k2{animation-delay:calc(1.58s*var(--k))}
.phrase .k3{animation-delay:calc(1.76s*var(--k))}
.phrase .x{overflow:hidden;animation:blurout calc(.6s*var(--k)) cubic-bezier(.6,0,.3,1) calc(2.1s*var(--k)) both}
.slogan{animation:up calc(.6s*var(--k)) var(--ease-in) calc(3.1s*var(--k)) both}
.actions{animation:up calc(.7s*var(--k)) var(--ease-in) calc(3.5s*var(--k)) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .phrase .x{display:none}
  .phrase .k{color:#FFFFFF}
  .phrase{transform:scale(1.2)}
}

.dev-replay{position:fixed;right:16px;top:16px;height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#FFFFFF;font-family:inherit;font-size:13px;font-weight:600;line-height:1;cursor:pointer}
</style>
</head>
<body>
<main class="login" id="login">
  <h1 class="wordmark" style="margin:0">nanaki</h1>

  <div class="avatar" aria-hidden="true">
    <span class="ring r1"></span><span class="ring r2"></span>
    <svg viewBox="0 0 48 48">
      <circle class="av-circle" cx="24" cy="24" r="24" fill="#FFFFFF"/>
      <path d="M24 20v-5" stroke="#2E7D4F" stroke-width="2.2" stroke-linecap="round"/>
      <path class="av-leafL" d="M24 15.5c-1.2-4.2-4.6-6.2-9.2-5.6.4 4.4 4 6.8 9.2 5.6z" fill="#6CC08F"/>
      <path class="av-leafR" d="M24 14.5c1.2-3.6 4.4-5.4 8.4-4.8-.6 3.8-3.8 5.8-8.4 4.8z" fill="#6CC08F"/>
      <g class="av-face">
        <circle cx="24" cy="29" r="10" fill="#2E7D4F"/>
        <g class="av-eyes">
          <ellipse cx="20.6" cy="28.6" rx="1.5" ry="1.9" fill="#FFFFFF"/>
          <ellipse cx="27.4" cy="28.6" rx="1.5" ry="1.9" fill="#FFFFFF"/>
        </g>
        <path d="M21.8 32.2q2.2 2 4.4 0" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <path class="av-spark" d="M37.5 11.6l.952 2.448 2.448.952-2.448.952-.952 2.448-.952-2.448-2.448-.952 2.448-.952z" fill="#2E7D4F"/>
    </svg>
  </div>

  <div class="phrase-row">
    <p class="phrase" aria-label="나는 나를 키운다" style="margin:0"><span class="k k1">나</span><span class="x">는</span><span class="x"> </span><span class="k k2">나</span><span class="x">를</span><span class="x"> </span><span class="k k3">키</span><span class="x">운</span><span class="x">다</span></p>
  </div>
  <p class="slogan" style="margin-bottom:0">오늘의 나를 돌보는 가장 작은 습관</p>

  <div class="actions">
    <button class="btn-google" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google로 시작하기
    </button>
    <button class="btn-guest" type="button">로그인 없이 체험하기</button>
    <div class="note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      체험 기록은 3일 뒤 삭제되고, 이 기기에서만 보여요
    </div>
  </div>
</main>

<!-- 개발 확인용 — 실제 앱에서는 제거 -->
<button class="dev-replay" type="button" onclick="const m=document.getElementById('login');const c=m.cloneNode(true);m.replaceWith(c);">다시 재생</button>
</body>
</html>
