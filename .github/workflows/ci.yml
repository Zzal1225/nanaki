name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소해서 시간을 아낀다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 코드를 읽기만 하면 되므로 권한을 최소로 둔다
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 버전은 .nvmrc 한 곳에서만 관리한다
          node-version-file: .nvmrc
          cache: npm

      # npm install과 달리 package-lock.json 그대로 설치해서 로컬과 같은 버전을 보장한다
      - run: npm ci

      # 빠르고 싼 검사를 앞에 둬서 실패를 빨리 알린다
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 진짜 Supabase에 붙는 통합 테스트 (RLS 사용자 격리, 계정 삭제 cascade).
  # 실제 서비스 DB가 아니라 이 실행 안에서만 사는 빈 로컬 Supabase(Docker)를 띄운다.
  # 마이그레이션을 처음부터 전부 적용하므로 "빈 DB에 마이그레이션이 깨끗이 들어가는지"도 함께 확인된다
  integration:
    runs-on: ubuntu-latest
    # 보통 7~10분, 느린 날은 13분까지 걸렸다. WebKit E2E(32단계)를 더해 15 → 20분
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Supabase CLI는 devDependencies에 있어 npx로 같은 버전을 쓴다.
      # 테스트에 필요 없는 서비스(실시간·파일 저장소·관리 화면 등)는 띄우지 않아 시간을 줄인다
      - name: 로컬 Supabase 시작
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      # 주소·키는 매번 로컬에서 새로 만들어지는 테스트용 값이라 비밀이 아니다
      - name: 테스트용 주소·키를 환경 변수로
        run: |
          npx supabase status -o json > supabase-status.json
          echo "SUPABASE_TEST_URL=$(jq -r '.API_URL' supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_ANON_KEY=$(jq -r '.ANON_KEY' supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_KEY=$(jq -r '.SERVICE_ROLE_KEY' supabase-status.json)" >> "$GITHUB_ENV"
          # 새 형식 관리자 키(sb_secret_...). 앱 서버(나키 하루 횟수, 계정 삭제)가 SUPABASE_SECRET_KEY로 쓴다
          echo "SUPABASE_TEST_SECRET_KEY=$(jq -r '.SECRET_KEY // empty' supabase-status.json)" >> "$GITHUB_ENV"

      - run: npm run test:integration

      # E2E: 같은 테스트용 Supabase에 붙는 앱을 빌드해 실제 브라우저로 사용자 흐름을 따라간다.
      # NEXT_PUBLIC_ 값은 빌드할 때 코드에 박히므로, 빌드와 실행 모두 테스트용 주소·키로 한다
      - name: E2E용 앱 빌드 (테스트용 Supabase에 연결)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
        run: npm run build

      # 크로미움 하나만 (용량·시간). --with-deps: 리눅스에 필요한 라이브러리까지
      - run: npx playwright install --with-deps chromium

      # 나키: AI를 부르지 않고 어댑터가 고정 응답을 돌려준다 (NAKI_FAKE_MODEL, CI에는 AI 키가 없고 실제 답은 매번 달라 흔들린다).
      # 하루 횟수는 진짜로 센다 (관리자 키 = 테스트용 로컬 Supabase의 키, 비밀 아님)
      - name: E2E + 화면 비교
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SUPABASE_TEST_SECRET_KEY }}
          NAKI_FAKE_MODEL: '1'
        run: npm run test:e2e

      # Playwright는 기준 이미지가 없으면 새로 써 놓고 통과시킨다. 그대로 두면 CI는 매번 새로 쓰고 비교 없이 넘어간다.
      # 새로 써진 이미지가 있으면 실패시키고(아래 단계가 아티팩트로 올림), 사람이 확인해 커밋해야 기준이 된다
      - name: 확인 안 된 새 기준 이미지가 없는지
        run: |
          NEW_SNAPSHOTS=$(git status --porcelain -- tests/e2e/visual.spec.ts-snapshots)
          if [ -n "$NEW_SNAPSHOTS" ]; then
            echo "::error::기준 이미지가 없는 화면이 있습니다. visual-snapshots 아티팩트를 내려받아 확인한 뒤 커밋하세요."
            echo "$NEW_SNAPSHOTS"
            exit 1
          fi

      # Lighthouse: 같은 빌드를 띄워 로그인·홈·기록 탭을 모바일 모드로 3번씩 잰다 (scripts/lighthouse.mts).
      # 기준(lighthouserc.json): 접근성·권장사항은 95 미만이면 실패, 성능은 80 미만이면 경고만.
      # 성능 점수는 CI 서버 상태에 따라 실행마다 몇 점씩 흔들려서, 실패 조건으로 두면 코드와 무관한 빨간불이 뜬다.
      # SEO는 재지 않는다: 로그인 뒤 화면은 robots.txt로 검색을 막아 두어 낮게 나오는 게 정상이다
      # 32단계: 같은 모바일 E2E를 사파리 엔진(WebKit)으로. 처음에는 경고만(continue-on-error): 흔들림이 없는지 몇 번 본 뒤 실패로 바꾼다.
      # 결과물은 다른 폴더에 둔다: 위 단계의 보고서·화면 비교 결과를 덮지 않게
      - run: npx playwright install --with-deps webkit
      - name: E2E (WebKit, 경고만)
        id: webkit
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SUPABASE_TEST_SECRET_KEY }}
          NAKI_FAKE_MODEL: '1'
          E2E_WEBKIT: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit
        run: npx playwright test --project=mobile-webkit --output=test-results-webkit
      - name: WebKit 실패 알림
        if: steps.webkit.outcome == 'failure'
        run: echo "::warning::WebKit E2E가 실패했습니다 (아직 경고만). webkit-report 아티팩트에서 원인을 확인하세요."
      - uses: actions/upload-artifact@v4
        if: steps.webkit.outcome == 'failure'
        with:
          name: webkit-report
          path: |
            playwright-report-webkit/
            test-results-webkit/
          retention-days: 7
      - name: Lighthouse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
        run: |
          npm run start -- --port 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          npm run lighthouse

      # 기록이 많은 달(한 달 300개)의 홈 첫 표시·달 넘김·JS 전송량 (scripts/calendar-perf.mts).
      # 수치만 남기고 실패 조건은 두지 않는다: 매 PR의 추이를 보고, 개선 작업 때 전후를 비교하려는 것.
      # 앞 단계에서 띄운 서버가 살아 있으면 그대로 쓴다. 서버를 둘 띄우면 측정 중에 CPU를 나눠 써 수치가 흔들린다
      - name: 캘린더 성능 측정 (기록 300개)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
        run: |
          if ! curl -sf -o /dev/null http://localhost:3000/login; then
            npm run start -- --port 3000 &
            for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          fi
          npm run perf:calendar

      # 점수는 통과해도 남긴다: docs/performance.md의 기준 수치를 여기서 옮겨 적는다
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: |
            lighthouse-report/
            .lighthouseci/
            perf-report/
          # .lighthouseci는 점(.)으로 시작하는 숨김 폴더라 기본값이면 빠진다
          include-hidden-files: true
          retention-days: 7

      # 실패하면 화면·네트워크 기록(trace)이 담긴 보고서를 내려받아 볼 수 있게 남긴다
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 화면 비교 이미지. 기준 이미지가 없을 때(처음·새 화면) Playwright가 snapshots 폴더에 새로 써 두고,
      # 달라졌을 때는 test-results에 실제·차이 이미지를 남긴다. 내려받아 확인한 뒤 기준 이미지로 커밋한다
      # (글꼴 렌더링이 운영체제마다 달라 기준 이미지는 이 리눅스 환경에서 만든 것만 쓴다)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-snapshots
          path: |
            tests/e2e/visual.spec.ts-snapshots/
            test-results/
          retention-days: 7
